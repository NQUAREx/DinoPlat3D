name: Build and deploy static game
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install audio verification tools
        timeout-minutes: 5
        run: |
          if command -v ffmpeg && command -v ffprobe; then
            exit 0
          fi
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 install -y --no-install-recommends ffmpeg
      - run: npm test
      - run: npm run build
      - name: Verify complete static artifact
        run: |
          node --input-type=module -e '
            import { existsSync, readFileSync, readdirSync } from "node:fs";
            const html = readFileSync("dist/index.html", "utf8");
            for (const match of html.matchAll(/(?:src|href)="(\.\/assets\/[^"?#]+)/g)) {
              if (!existsSync("dist/" + match[1])) throw Error("Missing asset: " + match[1]);
            }
            const assets = readdirSync("dist/assets");
            for (const prefix of ["game-models-", "biome-models-", "bonus-models-", "index-"]) {
              if (!assets.some(name => name.startsWith(prefix))) throw Error("Missing bundle: " + prefix);
            }
            console.log("Static HTML and required model bundles verified");
          '
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
